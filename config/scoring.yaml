budget:
  per_session_ceiling_usd: 0.75
  daily_provider_ceiling_usd: 8.00
  openai_total_usd: 50.00
  anthropic_total_usd: 50.00
  openai_reserve_at_usd: 44.00
  openai_block_at_usd: 48.00
  anthropic_reserve_at_usd: 44.00
  anthropic_block_at_usd: 48.00

# ----------------------------------------------------------------------
# scheduling (America/New_York)
# ----------------------------------------------------------------------
schedule:
  briefing_et: "08:45"
  discovery_refresh_et: "09:35"
  full_scans_et: ["09:40", "10:15", "11:30", "13:30", "15:00"]
  breadth_check_et: ["11:00", "14:00"]
  tier_check_et: ["12:30", "14:15"]
  event_loop_seconds: 300
  position_monitor_seconds: 120
  sec_poll_seconds: 90
  news_poll_seconds: 60
  lessons_et: "16:15"

# ----------------------------------------------------------------------
# activity target (v2.4 Â§1.5)
# Lifecycle demonstration is NOT a mandate to force alpha bets.
# ----------------------------------------------------------------------
activity_target:
  min_order_lifecycles: 6
  target_alpha_trades: [3, 8]
  max_alpha_trades_before_concern: 20
  calibration_trades_allowed: 3
  calibration_trade_max_qty: 1
  calibration_trade_symbols: [SPY, QQQ]   # tightest spreads available

rate_limits:
  alpaca_requests_per_minute: 150
  alpaca_burst: 20
  sec_requests_per_second: 5
  max_retries: 4
  backoff_base_seconds: 1.0
  backoff_max_seconds: 30.0
