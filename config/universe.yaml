# ======================================================================
# Alpha Council v2.4 - config/universe.yaml
#
# v2.4: the ~65-name list is the CORE UNIVERSE, not the search ceiling.
# Core is always scanned. The Dynamic Discovery Universe adds up to 250
# symbols from screeners, news, and SEC events, each with a TTL.
#
# BREAKING CHANGE from v2.3: the top-level key is now `core_symbols`,
# not `symbols`. Update scripts/test_alpaca_data.py accordingly.
# ======================================================================

benchmarks:
  broad: SPY
  tech: QQQ
  small_cap: IWM
  dow: DIA

benchmark_map:
  TECH: QQQ
  COMM: QQQ
  CONS_DISC: SPY
  CONS_STAPLE: SPY
  FINANCIAL: SPY
  ENERGY: SPY
  HEALTH: SPY
  INDUSTRIAL: SPY
  INDEX: SPY
  UNKNOWN: SPY          # dynamic symbols with no sector mapping

core_symbols:
