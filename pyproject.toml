[project]
name = "alpha-council"
version = "0.1.0"
description = "Autonomous options-native trading desk for the Alpaca AI Trading Agents Hackathon"
readme = "README.md"
authors = [
    { name = "JFKELLY89", email = "jfkelly89@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=1.2.0",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "lxml>=6.1.2",
    "mcp>=2.1.1",
    "numpy>=2.4.6",
    "openai>=3.5.0",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "streamlit>=1.62.0",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

# The package lives at ./alpha_council, not ./src/alpha_council.
# Without this, uv_build looks under src/ and installs nothing useful,
# which is what caused ModuleNotFoundError on alpha_council.models.
[tool.uv.build-backend]
module-root = ""
module-name = "alpha_council"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-q"